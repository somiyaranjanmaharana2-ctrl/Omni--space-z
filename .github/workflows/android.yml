
name: Build Omni Space Z APK

on:
  workflow_dispatch:
  push:
    paths:
      - "OmniSpaceZ_Android_Project.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: unzip OmniSpaceZ_Android_Project.zip -d extracted

      - name: Build APK
        working-directory: extracted/OmniSpaceZ_Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Omni-Space-Z-APK
          path: extracted/OmniSpaceZ_Android/app/build/outputs/apk/debug/app-debug.apk
          
